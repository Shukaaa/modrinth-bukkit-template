name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v5.0.0
      - run: ./gradlew clean check shadowJar verifyReleaseJar
      - run: npm ci
