name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5.0.0
      - run: npm ci
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
      - id: tag
        shell: bash
        run: echo "tag=$(git tag --points-at "$GITHUB_SHA" --list 'v*' | head -n 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ steps.tag.outputs.tag != '' }}
        with:
          name: release-jar
          path: build/libs/template-plugin-${{ steps.tag.outputs.tag }}.jar
          if-no-files-found: error

  modrinth:
    needs: release
    if: ${{ needs.release.result == 'success' && needs.release.outputs.tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-jar
          path: release
      - uses: cloudnode-pro/modrinth-publish@v2.5.1
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ vars.MODRINTH_PROJECT_ID }}
          version: ${{ needs.release.outputs.tag }}
          loaders: '["bukkit","spigot","paper","purpur"]'
          game-versions: '>=1.21 <=26.2'
          files: release/template-plugin-${{ needs.release.outputs.tag }}.jar
          primary-file: template-plugin-${{ needs.release.outputs.tag }}.jar
          environment: dedicated_server_only
